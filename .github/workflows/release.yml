name: Release - Publicación Oficial

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Generar Release Oficial en GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear Release con actions/github-script
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ci.yml`;
            const body = [
              `## Release Oficial ${tag}`,
              '',
              `Commit: \`${sha}\``,
              '',
              '### Estado de calidad',
              `Este release se generó a partir del commit etiquetado. El resultado de lint, build y pruebas es el reportado por el workflow de CI para ese commit: ${runUrl}`,
              '',
              'No se repiten aquí certificaciones que no hayan sido ejecutadas en el runner.',
              '',
              '---',
              '*Publicación generada de forma automatizada mediante actions/github-script.*'
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: body,
              draft: false,
              prerelease: false
            });
