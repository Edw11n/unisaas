name: Mantener Supabase Activo (Anti-Pausa Free Tier)

on:
  schedule:
    # Se ejecuta todos los lunes, miercoles y viernes a las 04:00 UTC
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping-health:
    name: Ping Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Ping HTTP a UniSaaS
        env:
          APP_URL: ${{ secrets.UNISAAS_VERCEL_URL }}
        run: |
          TARGET_URL="${APP_URL:-https://unisaasdev.vercel.app}"
          echo "Realizando health check a: $TARGET_URL/api/health"
          curl -f -s -S -m 30 "$TARGET_URL/api/health" || echo "Fallo el ping a $TARGET_URL/api/health pero se registro la actividad."
